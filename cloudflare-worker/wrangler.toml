name = "codebuddy-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 自定义域名路由
# 注意：需要先在 Cloudflare Dashboard 中将域名添加到你的账户
# 取消注释并替换为你的域名
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# KV 命名空间绑定
# 请运行 `wrangler kv:namespace create CREDENTIALS_KV` 创建 KV 命名空间
# 然后将生成的 ID 填入下方
[[kv_namespaces]]
binding = "CREDENTIALS_KV"
id = "your-kv-namespace-id-here"

# 环境变量（仅用于开发环境，生产环境请使用 secrets）
# 开发时可以在这里设置默认值，部署时会被 secrets 覆盖
[vars]
CODEBUDDY_API_ENDPOINT = "https://www.codebuddy.ai"
ROTATION_COUNT = "1"
MODELS = "auto-chat,gpt-5,gpt-5-mini,gpt-5-nano,o4-mini,gemini-2.5-flash,gemini-2.5-pro,gemini-3.0-pro,gemini-3.0-flash,glm-5.0,glm-4.6,kimi-k2.5,deepseek-v3.2"

# 敏感信息使用 secrets 存储（推荐）
# 部署前请运行以下命令设置密钥：
#   wrangler secret put WEB_PASSWORD
#   wrangler secret put API_KEY
#
# 注意：secrets 优先级高于 vars，部署后会覆盖 vars 中的同名变量
